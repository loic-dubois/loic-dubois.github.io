<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intrinsic Delaunay of a flat torus: interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#1d2433; --ink2:#4a5262; --muted:#8a909c; --line:#e4e1d8; --accent:#2563eb; --path:#c2410c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:26px 22px 40px; }
  h1 { font:600 26px/1.2 "Source Serif 4", Georgia, serif; margin:0 0 4px; }
  .sub { color:var(--ink2); margin:0 0 18px; }
  .bar { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; margin-bottom:12px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:transparent; padding:6px 12px; font:500 13px Inter, sans-serif; color:var(--ink2); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--ink); color:#fff; }
  .ctl { display:flex; align-items:center; gap:8px; color:var(--ink2); font-size:13px; }
  .ctl input[type=range] { width:130px; accent-color:var(--ink); }
  .val { font:500 12.5px "JetBrains Mono", monospace; color:var(--ink); min-width:34px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px; font:500 13px Inter, sans-serif; cursor:pointer; color:var(--ink); }
  .btn:hover { border-color:#c9c5b8; }
  .stage { background:#fff; overflow:hidden; }
  .cvwrap { position:relative; }
  canvas#cv { display:block; width:100%; height:min(62vh, 600px); cursor:grab; background:#ffffff; }
  .tag { position:absolute; left:12px; top:10px; background:rgba(255,255,255,.92); border-radius:7px; padding:6px 10px; }
  .tag .t { font:600 15px "Source Serif 4", serif; }
  .tag .d { font-size:12.5px; color:var(--ink2); }
  .dense { position:absolute; left:12px; bottom:10px; font-size:12px; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:4px 9px; border-radius:6px; display:none; }
  .legend { position:absolute; right:12px; top:10px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font-size:12px; color:var(--ink2); display:flex; flex-direction:column; gap:2px; }
  .ln { display:inline-block; width:16px; border-top:2.5px solid; vertical-align:3px; margin-right:6px; }
  .sw { display:inline-block; width:12px; height:9px; border-radius:2px; margin-right:6px; vertical-align:-0.5px; }
  /* timeline scrubber */
  .tl { display:flex; align-items:center; gap:12px; padding:10px 14px 12px; }
  #play { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; flex:none; }
  #strip { position:relative; flex:1; height:38px; display:flex; gap:2px; cursor:ew-resize; touch-action:none; user-select:none; }
  #strip .s { flex:1; border-radius:3px; background:#e9e6dd; position:relative; }
  #strip .s i { position:absolute; left:0; right:0; bottom:0; border-radius:3px; }
  #strip .s.cur { outline:2px solid var(--ink); outline-offset:1px; }
  #strip .s.past i { opacity:1; } #strip .s i { opacity:.45; }
  .stats { display:flex; gap:26px; padding:0 14px 12px; flex-wrap:wrap; }
  .stat .k { font-size:11px; color:var(--muted); }
  .stat .v { font:500 16px "JetBrains Mono", monospace; }
  details { margin-top:16px; color:var(--ink2); font-size:13px; }
  details summary { cursor:pointer; color:var(--muted); }
  details ul { margin:8px 0 0; padding-left:18px; } details li { margin:3px 0; }
  .err { color:#b91c1c; }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="seg" id="presets">
      <button data-p="rand" class="on">Random triangulation</button>
      <button data-p="tx">Two skinny triangles</button>
    </div>
    <div class="ctl" id="crand">
      vertices <input type="range" id="nr" min="10" max="300" step="1" value="40"><span class="val" id="nv">40</span>
      skew <input type="range" id="tr" min="0" max="3" step="0.01" value="0.7"><span class="val" id="tv">5</span>
      <button class="btn" id="seed">New</button>
    </div>
    <div class="ctl" id="ctx" style="display:none">
      skew <input type="range" id="xr" min="0.1" max="4" step="0.01" value="1.3"><span class="val" id="xv">20</span>
    </div>
  </div>

  <div class="stage">
    <div class="cvwrap">
      <canvas id="cv"></canvas>
      <div class="tag"><div class="t" id="stitle"></div></div>
      <div class="dense" id="dense"></div>
    </div>
    <div class="tl">
      <div id="strip"></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>


</div>

<script>
// Core of the demo: the algorithm of Proposition 1.3 (flat surfaces), specialised to flat tori
// given as translation-surface portalgons, plus Delaunay extraction and baselines.
// Each half-edge = {o: vertexId, v: [dx,dy]}; a face = {hes:[...], region}; region 0 = active.

const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const neg = (a) => [-a[0], -a[1]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
const len = (a) => Math.hypot(a[0], a[1]);

const rnd = (x) => { const r = Math.sign(x) * Math.round(Math.abs(x) * 1e6); return r === 0 ? 0 : r; };
const heKey = (o, v) => o + ':' + rnd(v[0]) + ',' + rnd(v[1]);
const dest = (F, i) => F.hes[(i + 1) % F.hes.length].o;
const twinKey = (F, i) => heKey(dest(F, i), neg(F.hes[i].v));

function buildIndex(faces) {
  const m = new Map();
  faces.forEach((F, f) => F.hes.forEach((h, i) => m.set(heKey(h.o, h.v), { f, i })));
  return m;
}

// ---------- lattice helpers (used for N, rendering and analysis only) ----------
function gaussReduce(b1, b2) {
  let a = b1, b = b2;
  if (len(a) > len(b)) [a, b] = [b, a];
  for (let it = 0; it < 10000; it++) {
    const k = Math.round(dot(a, b) / dot(a, a));
    b = sub(b, mul(a, k));
    if (len(b) < len(a)) [a, b] = [b, a]; else break;
  }
  if (cross(a, b) < 0) b = neg(b);
  return [a, b];
}
function reduceIntoCell(p, L) { // put a point into the fundamental parallelogram of L
  const d = cross(L[0], L[1]);
  const s = cross(p, L[1]) / d, t = cross(L[0], p) / d;
  return sub(p, add(mul(L[0], Math.floor(s)), mul(L[1], Math.floor(t))));
}

// ---------- state ----------
function makeInput(p, q) {
  // two triangles (0,p,q) and (p, p+q, q); torus R^2 / <p,q>; one vertex (id 0)
  if (cross(p, q) < 0) [p, q] = [q, p];
  const S = { verts: new Map(), faces: [], nextV: 1, nextR: 1, lattice: [p, q] };
  S.verts.set(0, { pos: [0, 0] });
  S.faces.push({ region: 0, hes: [{ o: 0, v: p }, { o: 0, v: sub(q, p) }, { o: 0, v: neg(q) }] });
  S.faces.push({ region: 0, hes: [{ o: 0, v: q }, { o: 0, v: neg(p) }, { o: 0, v: sub(p, q) }] }); // (p, p+q, q), ccw
  return S;
}
function newVertex(S, pos) { const id = S.nextV++; S.verts.set(id, { pos: reduceIntoCell(pos, S.lattice) }); return id; }
function cloneState(S) {
  return {
    verts: new Map([...S.verts].map(([k, v]) => [k, { pos: v.pos.slice() }])),
    faces: S.faces.map((F) => ({ region: F.region, hes: F.hes.map((h) => ({ o: h.o, v: h.v.slice() })) })),
    nextV: S.nextV, nextR: S.nextR, lattice: S.lattice,
  };
}
function pruneVertices(S) {
  const used = new Set(); S.faces.forEach((F) => F.hes.forEach((h) => used.add(h.o)));
  for (const k of [...S.verts.keys()]) if (!used.has(k)) S.verts.delete(k);
}
// label-free description of a triangulation: each face as its cyclic sequence of edge vectors
// (rotated to a canonical start); translations of the torus are ignored
function canonical(S) {
  const r = (x) => rnd(x).toString();
  const faces = S.faces.map((F) => {
    const vs = F.hes.map((h) => r(h.v[0]) + ',' + r(h.v[1]));
    let best = null;
    for (let k = 0; k < vs.length; k++) { const rot = vs.slice(k).concat(vs.slice(0, k)).join(';'); if (best === null || rot < best) best = rot; }
    return F.region + '|' + best;
  }).sort();
  return faces.join('#') + '@' + S.verts.size; // up to translation: vertex positions are ignored
}
function signature(S) {
  return S.faces.map((F) => F.region + '|' + F.hes.map((h) => heKey(h.o, h.v)).sort().join(';')).sort().join('#');
}

// ---------- polygon geometry ----------
function coords(F) { const P = [[0, 0]]; for (let i = 0; i < F.hes.length - 1; i++) P.push(add(P[i], F.hes[i].v)); return P; }
function distPointSeg(p, a, b) {
  const ab = sub(b, a), t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / dot(ab, ab)));
  return len(sub(p, add(a, mul(ab, t))));
}
function pointInPoly(p, P) {
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [xi, yi] = P[i], [xj, yj] = P[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function properCross(a, b, c, d, eps) {
  const o1 = cross(sub(b, a), sub(c, a)), o2 = cross(sub(b, a), sub(d, a));
  const o3 = cross(sub(d, c), sub(a, c)), o4 = cross(sub(d, c), sub(b, c));
  return ((o1 > eps && o2 < -eps) || (o1 < -eps && o2 > eps)) && ((o3 > eps && o4 < -eps) || (o3 < -eps && o4 > eps));
}
// vertex-to-vertex arc test: relative interior inside the open polygon
function isArc(P, i, j) {
  const k = P.length;
  if (i === j || (i + 1) % k === j || (j + 1) % k === i) return false;
  const A = P[i], B = P[j];
  const scale = Math.max(1e-300, ...P.map((p) => Math.max(Math.abs(p[0]), Math.abs(p[1]))));
  for (let m = 0; m < k; m++) if (m !== i && m !== j && distPointSeg(P[m], A, B) < 2e-15 * scale) return false;
  for (let m = 0; m < k; m++) {
    const n = (m + 1) % k;
    if (m === i || m === j || n === i || n === j) continue;
    if (properCross(A, B, P[m], P[n], 1e-14 * scale * scale)) return false;
  }
  return pointInPoly(mul(add(A, B), 0.5), P);
}
function shortcut(F) {
  const P = coords(F); let best = null;
  for (let i = 0; i < P.length; i++) for (let j = i + 2; j < P.length; j++) {
    if (!isArc(P, i, j)) continue;
    const l = len(sub(P[j], P[i]));
    if (!best || l < best.l - 1e-12) best = { i, j, l, d: sub(P[j], P[i]) };
  }
  return best;
}
function splitFace(F, s) {
  const E = F.hes, { i, j, d } = s;
  const f1 = { region: F.region, hes: [...E.slice(i, j), { o: E[j].o, v: neg(d) }] };
  const f2 = { region: F.region, hes: [...E.slice(j), ...E.slice(0, i), { o: E[i].o, v: d.slice() }] };
  return [f1, f2];
}

// ---------- routines of Section 4 ----------
const C = () => ({ insV: 0, insE: 0, delV: 0, redSteps: 0, bifaces: 0 });

function insertVertices(S, cnt) {
  const idx = buildIndex(S.faces), mid = new Map();
  for (const F of S.faces) {
    if (F.region !== 0) continue;
    const nh = [];
    F.hes.forEach((h, i) => {
      const tw = idx.get(twinKey(F, i));
      if (!tw || S.faces[tw.f].region !== 0) { nh.push(h); return; } // boundary of active region
      const k1 = heKey(h.o, h.v), k2 = twinKey(F, i), ck = k1 < k2 ? k1 : k2;
      let m = mid.get(ck);
      if (m === undefined) { m = newVertex(S, add(S.verts.get(h.o).pos, mul(h.v, 0.5))); mid.set(ck, m); cnt.insV++; }
      const hv = mul(h.v, 0.5);
      nh.push({ o: h.o, v: hv }, { o: m, v: hv.slice() });
    });
    F.hes = nh;
  }
}

function insertEdges(S, cnt) {
  const out = [];
  const stack = [...S.faces];
  while (stack.length) {
    const F = stack.pop();
    if (F.region !== 0 || F.hes.length <= 3) { out.push(F); continue; }
    const s = shortcut(F);
    if (!s) throw new Error('no vertex-to-vertex arc found');
    cnt.insE++;
    stack.push(...splitFace(F, s));
  }
  S.faces = out;
}

function activeVertexInfo(S) {
  const info = new Map();
  const get = (v) => { if (!info.has(v)) info.set(v, { deg: 0, loop: false, touchesInactive: false, nbrs: new Set() }); return info.get(v); };
  const idx = buildIndex(S.faces);
  S.faces.forEach((F) => F.hes.forEach((h, i) => {
    const I = get(h.o), d = dest(F, i);
    if (F.region !== 0) { I.touchesInactive = true; return; }
    I.deg++;
    if (d === h.o) I.loop = true; else I.nbrs.add(d);
    const tw = idx.get(twinKey(F, i));
    if (!tw || S.faces[tw.f].region !== 0) { I.touchesInactive = true; get(d).touchesInactive = true; }
  }));
  return info;
}

function deleteVertices(S, cnt) {
  const info = activeVertexInfo(S);
  const chosen = [];
  const blocked = new Set();
  for (const v of [...info.keys()].sort((a, b) => a - b)) {
    const I = info.get(v);
    const weak = !I.loop && !I.touchesInactive && I.deg > 0;
    if (!weak || I.deg > 6 || blocked.has(v)) continue;
    chosen.push(v); blocked.add(v); I.nbrs.forEach((n) => blocked.add(n));
  }
  if (!chosen.length) return;
  const idx = buildIndex(S.faces);
  const remove = new Set(), added = [];
  for (const v of chosen) {
    const f0 = S.faces.findIndex((F, fi) => F.region === 0 && F.hes.some((h) => h.o === v));
    const chain = [];
    let f = f0, guard = 0;
    do {
      const F = S.faces[f], k = F.hes.length, c = F.hes.findIndex((h) => h.o === v);
      for (let t = 1; t <= k - 2; t++) chain.push(F.hes[(c + t) % k]); // from b around to a
      remove.add(f);
      const inIdx = (c - 1 + k) % k; // a -> v
      f = idx.get(twinKey(F, inIdx)).f;
      if (++guard > 20) throw new Error('star walk failed');
    } while (f !== f0);
    added.push({ region: 0, hes: chain.map((h) => ({ o: h.o, v: h.v.slice() })) });
    cnt.delV++;
  }
  S.faces = S.faces.filter((_, i) => !remove.has(i)).concat(added);
  pruneVertices(S);
}

// real-RAM friendly rounding of t = <u,w>/<w,w> by doubling + halving (Lemma A.1 flavour)
function reduceMod(u, w, cnt) {
  const t = dot(u, w) / dot(w, w), s = t < 0 ? -1 : 1, a = Math.abs(t);
  let k = 0, steps = 0;
  if (a > 0.5) {
    let pw = 1; while (pw * 2 <= a) { pw *= 2; steps++; }
    let rem = a;
    for (; pw >= 1; pw /= 2) { if (rem >= pw) { rem -= pw; k += pw; } steps++; }
    if (rem > 0.5) k += 1;
    steps++;
  }
  cnt.redSteps += steps; cnt.bifaces++;
  return sub(u, mul(w, s * k));
}

// good biface of a flat annulus bounded by loops at p (vector w) and q, crossing vector u (p -> q)
function goodBiface(p, q, w, u, cnt) {
  const ur = reduceMod(u, w, cnt);
  const wp = cross(w, ur) > 0 ? w : neg(w);
  const f1 = add(wp, ur), f2 = sub(ur, wp);
  let faces;
  if (len(f1) <= len(f2)) faces = [
    [{ o: p, v: wp }, { o: p, v: ur }, { o: q, v: neg(f1) }],
    [{ o: p, v: f1 }, { o: q, v: neg(wp) }, { o: q, v: neg(ur) }]];
  else faces = [
    [{ o: p, v: wp }, { o: p, v: f2 }, { o: q, v: neg(ur) }],
    [{ o: p, v: ur }, { o: q, v: neg(wp) }, { o: q, v: neg(f2) }]];
  const interior = Math.min(len(ur), len(f1), len(f2));
  return { faces, thin: interior > len(w) * (1 + 1e-9), e: ur, f: len(f1) <= len(f2) ? f1 : f2, w: wp };
}

// dual components of a set of faces, not crossing half-edges whose key is in `cut`
function components(S, faceSet, cut) {
  const idx = buildIndex(S.faces), seen = new Set(), comps = [];
  for (const f0 of faceSet) {
    if (seen.has(f0)) continue;
    const comp = [], st = [f0]; seen.add(f0);
    while (st.length) {
      const f = st.pop(); comp.push(f);
      const F = S.faces[f];
      F.hes.forEach((h, i) => {
        if (cut && cut.has(heKey(h.o, h.v))) return;
        const tw = idx.get(twinKey(F, i));
        if (tw && faceSet.has(tw.f) && !seen.has(tw.f)) { seen.add(tw.f); st.push(tw.f); }
      });
    }
    comps.push(comp);
  }
  return comps;
}

// is this component a tube? boundary = half-edges whose twin is outside the component (or cut)
function tubeData(S, comp, cut) {
  const idx = buildIndex(S.faces), inC = new Set(comp);
  const bnd = [], V = new Set(); let he = 0;
  for (const f of comp) {
    const F = S.faces[f];
    F.hes.forEach((h, i) => {
      V.add(h.o); he++;
      const tw = idx.get(twinKey(F, i));
      if ((cut && cut.has(heKey(h.o, h.v))) || !tw || !inC.has(tw.f)) bnd.push({ h, d: dest(F, i) });
    });
  }
  const E = (he - bnd.length) / 2 + bnd.length;
  const chi = V.size - E + comp.length;
  if (bnd.length !== 2 || chi !== 0) return null;
  if (bnd.some((b) => b.d !== b.h.o) || bnd[0].h.o === bnd[1].h.o) return null;
  return { p: bnd[0].h.o, q: bnd[1].h.o, w: bnd[0].h.v };
}

function crossingVector(S, comp, p, q) {
  const disp = new Map([[p, [0, 0]]]), queue = [p];
  const adj = new Map();
  for (const f of comp) { const F = S.faces[f]; F.hes.forEach((h, i) => { if (!adj.has(h.o)) adj.set(h.o, []); adj.get(h.o).push({ d: dest(F, i), v: h.v }); }); }
  while (queue.length) {
    const x = queue.shift();
    for (const { d, v } of adj.get(x) || []) if (!disp.has(d)) { disp.set(d, add(disp.get(x), v)); queue.push(d); }
  }
  return disp.get(q);
}

function replaceTube(S, comp, td, markInactive, cnt, log) {
  const u = crossingVector(S, comp, td.p, td.q);
  const B = goodBiface(td.p, td.q, td.w, u, cnt);
  const region = markInactive || B.thin ? S.nextR++ : 0;
  const drop = new Set(comp);
  const nInterior = new Set(comp.flatMap((f) => S.faces[f].hes.map((h) => h.o))).size - 2;
  S.faces = S.faces.filter((_, i) => !drop.has(i)).concat(B.faces.map((hes) => ({ region, hes })));
  pruneVertices(S);
  log.push(`${B.thin ? 'thin' : 'thick'} good biface (${nInterior} interior vertices removed)${region ? ', marked inactive' : ''}`);
  return B;
}

function gardening(S, cnt, log) {
  let changed = true;
  while (changed) {
    changed = false;
    const act = new Set(S.faces.map((F, i) => (F.region === 0 ? i : -1)).filter((i) => i >= 0));
    if (!act.size) return;
    for (const comp of components(S, act, null)) {
      const td = tubeData(S, comp, null);
      if (td) { replaceTube(S, comp, td, true, cnt, log); changed = true; break; }
    }
  }
}

function simplifyTubes(S, cnt, log) {
  if (!S.faces.length || S.faces.some((F) => F.region !== 0)) return; // case (b) never arises on a torus here
  // case (a): S(T) is a torus. J = two disjoint loop edges, if they exist.
  const loops = new Map();
  S.faces.forEach((F) => F.hes.forEach((h, i) => {
    if (dest(F, i) === h.o) { const L = loops.get(h.o); if (!L || len(h.v) < len(L.v)) loops.set(h.o, h); }
  }));
  if (loops.size < 2) return;
  const [L1, L2] = [...loops.values()].sort((a, b) => len(a.v) - len(b.v));
  const cut = new Set([heKey(L1.o, L1.v), heKey(L1.o, neg(L1.v)), heKey(L2.o, L2.v), heKey(L2.o, neg(L2.v))]);
  const all = new Set(S.faces.map((_, i) => i));
  const comps = components(S, all, cut);
  const tubes = comps.map((c) => ({ c, td: tubeData(S, c, cut) })).filter((x) => x.td);
  if (!tubes.length) return;
  // replace both tubes at once (face indices are invalidated by replacement)
  const newFaces = [], drop = new Set();

}

// ---------- canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d');
function resize() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; draw(); }
function draw() {
  if (!steps.length) return;
  const st = steps[cur], S = st.S, prev = cur > 0 && st.phase !== 'delaunay' ? steps[cur - 1].S : null;
  LB = gaussReduce(S.lattice[0], S.lattice[1]);

  const sc = Math.min(W, H) / (2 * view.R), Rw = Math.hypot(W, H) / 2 / sc, C = [view.cx, view.cy];
  const toS = (p) => [W / 2 + (p[0] - C[0]) * sc, H / 2 - (p[1] - C[1]) * sc];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  for (const F of S.faces) est += (F.hes.reduce((t, h) => t + len(h.v), 0) * Rw + Math.PI * Rw * Rw) / det;
  let tooDense = est > 250000;

    for (const { F, P, lifts } of faces) if (F.region !== 0) { ctx.fillStyle = REGION_COLORS[(F.region - 1) % 6]; ctx.beginPath(); path(lifts, P); ctx.fill(); }
    ctx.lineWidth = Math.max(0.5, 1.5 / Math.sqrt(dens)) * d; ctx.globalAlpha = Math.max(0.15, 1 / dens);

    ctx.restore();
  }
  // vertices
  ctx.fillStyle = '#1d2433';

  ctx.beginPath();
  for (const [, v] of S.verts) for (const l of liftsOfSegs([[v.pos, [0, 0]]], C, Rw, 20000) || []) { const s = toS(add(v.pos, l)); ctx.moveTo(s[0] + r, s[1]); ctx.arc(s[0], s[1], r, 0, 7); }
  ctx.fill();

  const e = null;
  if (e) {
    let best = null; for (const x of dirichletVertices(S.lattice)) if (!best || Math.abs(cross(x, e)) > Math.abs(cross(best, e))) best = x;
    const c0 = add(C, [view.R * 0.071, view.R * 0.043]), A = sub(c0, mul(best, 0.5)), B = add(c0, mul(best, 0.5));
    let seg = null;
    for (const F of S.faces) { const P = coords(F).map((c) => add(c, S.verts.get(F.hes[0].o).pos)); F.hes.forEach((h, i) => { if (!seg && Math.abs(len(h.v) - len(e)) < 1e-9 * len(e)) seg = { P: P[i], v: h.v }; }); }
    const pts = [];

    if (lifts) for (const l of lifts) {
      const p = add(seg.P, l), q = add(p, seg.v);

    ctx.strokeStyle = '#c2410c'; ctx.lineWidth = 2.5 * d; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.fillStyle = '#c2410c';
    if (pts.length < 2000) for (const p of pts) { const s = toS(p); ctx.beginPath(); ctx.arc(s[0], s[1], 3.4 * d, 0, 7); ctx.fill(); }

    const lab = `${n.toLocaleString()} crossing${n === 1 ? '' : 's'}`;
    if (n >= 2) { ctx.lineWidth = 4 * d; ctx.strokeStyle = '#fff'; ctx.strokeText(lab, b[0] + 8 * d, b[1]); ctx.fillText(lab, b[0] + 8 * d, b[1]); }
  }

}

// pan & zoom
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', (e) => { if (!drag) return; const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height) / (2 * view.R); view.cx = drag.cx - (e.clientX - drag.x) / s; view.cy = drag.cy + (e.clientY - drag.y) / s; redraw(); });
cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); view.R = Math.min(view.R0 * 6, Math.max(view.R0 / 8, view.R * Math.exp(e.deltaY * 0.0012))); redraw(); }, { passive: false });
let raf = 0; const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };

// ---------- controls ----------
$('presets').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  preset = b.dataset.p; [...$('presets').children].forEach((x) => x.classList.toggle('on', x === b));
  $('crand').style.display = preset === 'rand' ? '' : 'none'; $('ctx').style.display = preset === 'tx' ? '' : 'none';
  compute();
});
let tmr = 0; const later = () => { clearTimeout(tmr); tmr = setTimeout(compute, 200); };
$('nr').oninput = () => { $('nv').textContent = $('nr').value; later(); };
$('tr').oninput = () => { $('tv').textContent = skew().toLocaleString(); later(); };
$('xr').oninput = () => { $('xv').textContent = Math.round(xval()).toLocaleString(); later(); };
$('seed').onclick = () => { seed = (Math.random() * 2 ** 31) | 0; compute(); };
addEventListener('resize', resize);
$('tv').textContent = skew(); $('xv').textContent = Math.round(xval());
compute(); resize();
})();
</script>
