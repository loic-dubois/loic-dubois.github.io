<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal untangling obstructions</title>
<style>
/* VOICE: quiet, like a figure page of a math paper
   IDEA: a plate of figures, each one a live drawing
   PICTURE: the drawings themselves, in the style of Figure 1
   COLOUR and TYPE: black ink on white, grey surface, serif text
   LAYOUT: one grid of cards, controls in a thin bar above */
:root{color-scheme:light dark;--bg:light-dark(#fff,#151515);--ink:light-dark(#111,#eee);--muted:light-dark(#666,#aaa);--line:light-dark(#888,#999);--card:light-dark(#fff,#1d1d1d);--rule:light-dark(#e4e4e4,#333)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif;overflow-x:clip}
header{padding:20px max(4vw,16px) 8px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:0 0 6px;font-weight:normal}
h2{font-size:20px;font-weight:normal;margin:28px 0 10px}
p{max-width:70ch;margin:6px 0}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(4vw,16px);background:var(--bg);border-bottom:1px solid var(--rule)}
button{font:inherit;font-size:14px;min-height:36px;padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer}
button:focus-visible{outline:2px solid #2471a3;outline-offset:2px}
main{padding:20px max(4vw,16px) 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px}
.card svg{width:100%;aspect-ratio:1;display:block;touch-action:none;user-select:none}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:4px}
.meta .x{color:var(--muted);font-size:13px}
.meta button{min-height:28px;font-size:12px;padding:2px 8px}
.h{cursor:grab}
#outwrap{display:none;margin:14px 0}
textarea{width:100%;height:180px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);border:1px solid var(--rule)}
@media (max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style></head><body>
<main>
  <div class="grid" id="gA"></div>
  <div style="height:14px"></div><div class="grid" id="gG"></div>
</main>
<script src="obstructions.js"></script>
<script>
{

const NS='http://www.w3.org/2000/svg';
let showHandles=true;
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const load=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}};
const r4=x=>+x.toFixed(4);const Y=p=>[r4(p[0]),r4(-p[1])];
function isect(p1,p2,p3,p4){const cr=(a,b)=>a[0]*b[1]-a[1]*b[0];const d1=[p2[0]-p1[0],p2[1]-p1[1]],d2=[p4[0]-p3[0],p4[1]-p3[1]];const den=cr(d1,d2);if(Math.abs(den)<1e-12)return null;const w=[p3[0]-p1[0],p3[1]-p1[1]];const s=cr(w,d2)/den,t=cr(w,d1)/den,e=1e-7;if(s<-e||s>1+e||t<-e||t>1+e)return null;return[p1[0]+s*d1[0],p1[1]+s*d1[1]];}
function distSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function initState(d){
  const sps=[],idx={};
  const getSP=(s,t)=>{const k=s+':'+t.toFixed(6);if(!(k in idx)){idx[k]=sps.length;sps.push({s,t});}return idx[k];};
  const edges=d.edges.map(e=>{const ref=r=>('v' in r)?{v:r.v}:{sp:getSP(r.s,r.t)};return{a:ref(e.a),b:ref(e.b),bends:e.bends.map(p=>[p[0],p[1]])};});
  sps.forEach(p=>{const ps=d.sides[p.s].partner;p.partner=sps.findIndex(q=>q.s===ps&&Math.abs(q.t-(1-p.t))<1e-5);});
  return{verts:d.verts.map(v=>[v[0],v[1]]),sps,edges};
}
function arrowHeads(side,add){
  const s=side.end===0?side.A:side.B,e=side.end===0?side.B:side.A;
  const L=Math.hypot(e[0]-s[0],e[1]-s[1]);const u=[(e[0]-s[0])/L,(e[1]-s[1])/L];
  const m=[(side.A[0]+side.B[0])/2,(side.A[1]+side.B[1])/2];const n=[-u[1],u[0]];
  for(let j=0;j<=side.loop;j++){
    const c=[m[0]+u[0]*(0.06*j-0.03*side.loop),m[1]+u[1]*(0.06*j-0.03*side.loop)];
    const tip=[c[0]+u[0]*0.015,c[1]+u[1]*0.015],b=[c[0]-u[0]*0.045,c[1]-u[1]*0.045];
    add(`M${Y([b[0]+n[0]*0.025,b[1]+n[1]*0.025])} L${Y(tip)} L${Y([b[0]-n[0]*0.025,b[1]-n[1]*0.025])} Z`);
  }
}
class Fig{
  constructor(d,host){
    this.d=d;this.S=load('obst2-'+d.id)||initState(d);this.drag=null;
    const card=document.createElement('div');card.className='card';
    this.svg=document.createElementNS(NS,'svg');const R=Math.max(...d.sides.flatMap(s=>[Math.abs(s.A[0]),Math.abs(s.A[1]),Math.abs(s.B[0]),Math.abs(s.B[1])]))*1.08;this.R=R;this.svg.setAttribute('viewBox',`${-R} ${-R} ${2*R} ${2*R}`);
    this.svg.setAttribute('role','img');this.svg.setAttribute('aria-label','Drawing '+d.id);
    card.append(this.svg);host.appendChild(card);
    this.svg.addEventListener('pointermove',ev=>{if(!this.drag)return;ev.preventDefault();this.drag(this.toData(ev));this.render();});
    const end=ev=>{if(!this.drag)return;this.drag=null;try{this.svg.releasePointerCapture(ev.pointerId);}catch(e){}this.save();};
    this.svg.addEventListener('pointerup',end);this.svg.addEventListener('pointercancel',end);
    this.render();
  }
  reset(){this.S=initState(this.d);this.save();}
  save(){store('obst2-'+this.d.id,this.S);this.render();}
  toData(ev){const pt=this.svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(this.svg.getScreenCTM().inverse());return[q.x,-q.y];}
  spPos(sp){const s=this.d.sides[sp.s];return[s.A[0]+sp.t*(s.B[0]-s.A[0]),s.A[1]+sp.t*(s.B[1]-s.A[1])];}
  refPos(r){return('v' in r)?this.S.verts[r.v]:this.spPos(this.S.sps[r.sp]);}
  key(r){return ('v' in r)?'v'+r.v:'s'+r.sp;}
  groups(){ if(this._g) return this._g; const m={}; this.S.edges.forEach((e,i)=>{const a=this.key(e.a),b=this.key(e.b);const k=a<b?a+'|'+b:b+'|'+a;(m[k]=m[k]||[]).push(i);}); const off={}; Object.values(m).forEach(L=>L.forEach((i,j)=>{off[i]=(j-(L.length-1)/2);})); this._g=off; return off; }
  ctrl(e,i){ const a=this.refPos(e.a),b=this.refPos(e.b); const o=this.groups()[i]||0; const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2; const dx=b[0]-a[0],dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1; const s=o*0.35*L*(this.key(e.a)<this.key(e.b)?1:-1); return [mx-dy/L*s, my+dx/L*s]; }
  pts(e,i){ const a=this.refPos(e.a),b=this.refPos(e.b); if(i===undefined) i=this.S.edges.indexOf(e); if(!(this.groups()[i])) return [a,b]; const c=this.ctrl(e,i); const P=[]; for(let k=0;k<=12;k++){const t=k/12;P.push([(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]]);} return P; }
  pathD(e,i){ const a=this.refPos(e.a),b=this.refPos(e.b); if(!(this.groups()[i])) return `M${Y(a)} L${Y(b)}`; const c=this.ctrl(e,i); return `M${Y(a)} Q${Y(c)} ${Y(b)}`; }
  crossings(){
    const segs=[],ends=[];this.S.edges.forEach((e,ei)=>{const p=this.pts(e,ei);ends.push([p[0],p[p.length-1]]);for(let k=0;k<p.length-1;k++)segs.push([ei,p[k],p[k+1]]);});
    const seen=new Set();
    for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){const a=segs[i][0],b=segs[j][0];if(a===b)continue;const x=isect(segs[i][1],segs[i][2],segs[j][1],segs[j][2]);if(!x)continue;const near=p=>Math.hypot(p[0]-x[0],p[1]-x[1])<1e-6;if((near(ends[a][0])||near(ends[a][1]))&&(near(ends[b][0])||near(ends[b][1])))continue;seen.add(Math.min(a,b)+'-'+Math.max(a,b)+'@'+x[0].toFixed(4)+','+x[1].toFixed(4));}
    return seen.size;
  }
  grab(node,setter){node.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();this.drag=setter;try{this.svg.setPointerCapture(ev.pointerId);}catch(e){}});}
  el(tag,a,parent){const x=document.createElementNS(NS,tag);for(const k in a)x.setAttribute(k,a[k]);(parent||this.svg).appendChild(x);return x;}
  render(){
    const d=this.d,S=this.S;this.svg.innerHTML='';
    d.sides.forEach(s=>{this.el('path',{d:`M${Y(s.A)} L${Y(s.B)} L${Y(s.C)}`,stroke:'var(--line)','stroke-width':0.009,fill:'none'});arrowHeads(s,p=>this.el('path',{d:p,fill:'var(--line)'}));});
    S.edges.forEach((e,i)=>{ this.el('path',{d:this.pathD(e,i),stroke:'var(--ink)','stroke-width':0.011,fill:'none','stroke-linecap':'round'}); });
    S.verts.forEach((v,i)=>{const c=this.el('circle',{cx:v[0],cy:-v[1],r:0.032,fill:'var(--ink)',class:'h'});this.grab(c,p=>{S.verts[i]=p;});});
    if(showHandles){
      S.sps.forEach(sp=>{const p=this.spPos(sp);const c=this.el('circle',{cx:p[0],cy:-p[1],r:0.026,fill:'var(--card)',stroke:'#2471a3','stroke-width':0.008,class:'h'});
        this.grab(c,q=>{const s=d.sides[sp.s];const dx=s.B[0]-s.A[0],dy=s.B[1]-s.A[1];let t=((q[0]-s.A[0])*dx+(q[1]-s.A[1])*dy)/(dx*dx+dy*dy);t=Math.min(0.97,Math.max(0.03,t));sp.t=t;if(sp.partner>=0)S.sps[sp.partner].t=1-t;});});
    }
    
  }
  tikz(){
    const f=x=>(2*x).toFixed(3),d=this.d,L=[`% ${d.id}`,'\\begin{tikzpicture}'];
    d.sides.forEach(s=>{L.push(`\\draw[gray,thin] (${f(s.A[0])},${f(s.A[1])}) -- (${f(s.B[0])},${f(s.B[1])}) -- (${f(s.C[0])},${f(s.C[1])});`);
      const a=s.end===0?s.A:s.B,b=s.end===0?s.B:s.A;const len=Math.hypot(b[0]-a[0],b[1]-a[1]);const u=[(b[0]-a[0])/len,(b[1]-a[1])/len];const m=[(s.A[0]+s.B[0])/2,(s.A[1]+s.B[1])/2];
      for(let j=0;j<=s.loop;j++){const c=[m[0]+u[0]*(0.05*j-0.025*s.loop),m[1]+u[1]*(0.05*j-0.025*s.loop)];L.push(`\\draw[gray,thin,-{Stealth[length=1.6mm]}] (${f(c[0]-u[0]*0.04)},${f(c[1]-u[1]*0.04)}) -- (${f(c[0]+u[0]*0.01)},${f(c[1]+u[1]*0.01)});`);}});
    this.S.edges.forEach((e,i)=>{const a=this.refPos(e.a),b=this.refPos(e.b);if(!(this.groups()[i]))L.push(`\\draw (${f(a[0])},${f(a[1])}) -- (${f(b[0])},${f(b[1])});`);else{const c=this.ctrl(e,i);L.push(`\\draw (${f(a[0])},${f(a[1])}) .. controls (${f((a[0]+2*c[0])/3)},${f((a[1]+2*c[1])/3)}) and (${f((b[0]+2*c[0])/3)},${f((b[1]+2*c[1])/3)}) .. (${f(b[0])},${f(b[1])});`);}});
    this.S.verts.forEach(v=>L.push(`\\fill (${f(v[0])},${f(v[1])}) circle (1.4pt);`));
    L.push('\\end{tikzpicture}');return L.join('\n');
  }
  svgText(){
    const R=this.R;const parts=[`<svg xmlns="${NS}" viewBox="${r4(-R)} ${r4(-R)} ${r4(2*R)} ${r4(2*R)}" width="300" height="300">`];
    this.d.sides.forEach(s=>{parts.push(`<path d="M${Y(s.A)} L${Y(s.B)} L${Y(s.C)}" stroke="#888" stroke-width="0.009" fill="none"/>`);arrowHeads(s,p=>parts.push(`<path d="${p}" fill="#888"/>`));});
    this.S.edges.forEach((e,i)=>parts.push(`<path d="${this.pathD(e,i)}" stroke="#111" stroke-width="0.011" fill="none" stroke-linecap="round"/>`));
    this.S.verts.forEach(v=>parts.push(`<circle cx="${r4(v[0])}" cy="${r4(-v[1])}" r="0.032" fill="#111"/>`));
    parts.push('</svg>');return parts.join('\n');
  }
}
function start(list){
  const DATA=list.map(o=>({id:o.id,sides:o.drawing.sides,verts:o.drawing.verts,edges:o.drawing.edges.map(e=>({a:e.a,b:e.b,bends:[]}))}));
  window.FIGS=DATA.map(d=>new Fig(d,document.getElementById(d.id[0]==='A'?'gA':'gG')));
}
start(window.OBSTRUCTIONS||[]);
}
</script></body></html>
